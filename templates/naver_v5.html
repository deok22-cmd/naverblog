<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{TITLE}}</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; font-size: 16px; line-height: 1.9; color: #222; max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.6em; font-weight: 800; border-bottom: 5px solid {{ACCENT}}; padding-bottom: 12px; color: {{DARK}}; text-align: center; }
  h2 { font-size: 1.2em; font-weight: 700; background: {{TINT}}; padding: 12px 15px; border-left: 6px solid {{ACCENT}}; margin-top: 50px; color: {{DARK}}; }
  h3 { font-size: 1.05em; font-weight: 700; color: {{DARK}}; margin: 24px 0 8px; }
  .intro-box { background: {{SOFT}}; border: 2px solid {{BORDER}}; padding: 25px; border-radius: 10px; margin: 30px 0; }
  .info-table { width: 100%; margin: 20px 0; border-collapse: collapse; }
  .info-table th { background: {{ACCENT}}; color: #fff; padding: 9px 12px; text-align: left; font-size: 0.9em; }
  .info-table td { padding: 9px 12px; border-bottom: 1px solid #eee; font-size: 0.9em; }
  .info-table tr:nth-child(even) td { background: {{EVEN}}; }
  .img-area { margin: 30px 0; text-align: center; }
  .img-placeholder { border: 2px dashed {{BORDER}}; border-radius: 8px; padding: 20px; background: {{SOFT}}; }
  .ph-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; color: {{ACCENT}}; font-size: 0.9em; }
  .ph-file { font-size: 0.82em; color: #888; font-family: monospace; }
  .prompt-text { font-size: 0.82em; color: #555; line-height: 1.6; text-align: left; white-space: pre-wrap; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin: 10px 0; }
  .copy-btn { background: {{ACCENT}}; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 0.85em; cursor: pointer; }
  .img-caption { font-size: 0.88em; color: #666; margin-top: 8px; font-style: italic; }
  .info-box { background: {{SOFT}}; border: 1px solid {{BORDER}}; border-left: 4px solid {{ACCENT}}; padding: 15px 18px; margin: 20px 0; border-radius: 0 6px 6px 0; }
  .step-box { background: #fff; border: 1px solid #eee; border-left: 4px solid {{ACCENT}}; padding: 15px 20px; margin: 15px 0; }
  .tip-box { background: #fff8e1; border-left: 4px solid #ffc107; padding: 15px 18px; margin: 20px 0; border-radius: 0 6px 6px 0; }
  .warn-box { background: #fff3e0; border-left: 4px solid #ff6b00; padding: 15px 18px; margin: 20px 0; border-radius: 0 6px 6px 0; }
  .recommend-area { background: #f8f9fa; border: 1px solid #eee; padding: 20px; margin: 40px 0; border-radius: 10px; }
  .tag { display: inline-block; background: #f0f0f0; padding: 3px 10px; border-radius: 5px; margin: 3px; font-size: 0.85em; color: #666; border: 1px solid #ddd; }

  /* ========================================================
     🎨 다채널 인포그래픽 아키타입 CSS 시스템
     ========================================= */
  .infographic-box, [class*="infographic-"] {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  }
  .infographic-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    border-bottom: 2px dashed {{BORDER}};
    padding-bottom: 12px;
  }
  .infographic-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 1.1em;
    color: {{DARK}};
  }
  .infographic-badge {
    display: inline-block;
    background: {{ACCENT}};
    color: #ffffff;
    font-size: 0.75em;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
  }

  /* 1. 비교 매트릭스 카드 (.infographic-compare-box) */
  .infographic-compare-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .compare-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .compare-col {
    flex: 1;
    min-width: 150px;
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }
  .compare-col.highlight {
    background: {{SOFT}};
    border: 1.5px solid {{ACCENT}};
  }
  .compare-col-title {
    font-size: 0.95em;
    font-weight: 800;
    color: {{DARK}};
    margin-bottom: 6px;
  }
  .compare-col-badge {
    display: inline-block;
    background: {{ACCENT}};
    color: #fff;
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .compare-row {
    font-size: 0.82em;
    color: #444;
    line-height: 1.55;
    padding: 5px 0;
    border-bottom: 1px dashed #eee;
  }
  .compare-row:last-child {
    border-bottom: none;
  }

  /* 2. 일정/동선 타임라인 로드맵 (.infographic-timeline-box) */
  .infographic-timeline-box {
    background: {{SOFT}};
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .timeline-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
  }
  .timeline-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .timeline-badge {
    background: {{ACCENT}};
    color: #ffffff;
    font-size: 0.78em;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .timeline-content {
    flex: 1;
  }
  .timeline-title {
    font-size: 0.92em;
    font-weight: 700;
    color: {{DARK}};
    margin-bottom: 4px;
  }
  .timeline-desc {
    font-size: 0.82em;
    color: #555;
    line-height: 1.5;
  }

  /* 3. 코스/난코스 전술 공략도 (.infographic-strategy-box) */
  .infographic-strategy-box {
    background: #ffffff;
    border: 1.5px solid #ef4444;
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(239,68,68,0.06);
  }
  .strategy-grid {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .strategy-col {
    flex: 1;
    min-width: 220px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 14px;
  }
  .strategy-col.solution {
    background: {{SOFT}};
    border: 1px solid {{BORDER}};
  }
  .hazard-tag {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 0.72em;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .safe-tag {
    display: inline-block;
    background: #16a34a;
    color: #fff;
    font-size: 0.72em;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  /* 4. 실전 비용/예산 견적 영수증 (.infographic-receipt-box) */
  .infographic-receipt-box {
    background: #ffffff;
    border: 2px dashed #9ca3af;
    border-radius: 12px;
    padding: 24px 22px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .receipt-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 16px;
    font-size: 0.88em;
  }
  .receipt-table th {
    background: #f3f4f6;
    color: #374151;
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #d1d5db;
  }
  .receipt-table td {
    padding: 8px 10px;
    border-bottom: 1px dashed #e5e7eb;
    color: #4b5563;
  }
  .receipt-total {
    background: {{SOFT}};
    border-top: 2px solid {{ACCENT}};
    padding: 12px 16px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.1em;
    font-weight: 800;
    color: {{DARK}};
  }

  /* 5. 필수 점검 & 준비물 체크리스트 (.infographic-checklist-box) */
  .infographic-checklist-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .checklist-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .checklist-col {
    flex: 1;
    min-width: 190px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px;
  }
  .checklist-item {
    font-size: 0.82em;
    color: #374151;
    line-height: 1.5;
    padding: 6px 0;
    border-bottom: 1px dashed #eee;
  }
  .checklist-item:last-child {
    border-bottom: none;
  }

  /* 6. 단계별 신청/절차 플로우차트 (.infographic-flow-box) */
  .infographic-flow-box {
    background: {{SOFT}};
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .flow-steps {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: stretch;
    margin-top: 10px;
  }
  .flow-card {
    flex: 1;
    min-width: 130px;
    background: #ffffff;
    border: 1px solid {{BORDER}};
    border-radius: 8px;
    padding: 12px 10px;
    text-align: center;
  }
  .flow-step-num {
    font-size: 0.72em;
    font-weight: 800;
    color: {{ACCENT}};
    background: {{TINT}};
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .flow-title {
    font-size: 0.88em;
    font-weight: 700;
    color: {{DARK}};
    margin-bottom: 4px;
  }
  .flow-desc {
    font-size: 0.78em;
    color: #666;
    line-height: 1.4;
  }

  /* 7. 4분할 핵심 수치 매트릭스 (.infographic-stat-box) */
  .infographic-stat-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .stat-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .stat-card {
    flex: 1;
    min-width: 130px;
    background: {{SOFT}};
    border: 1px solid {{BORDER}};
    border-radius: 8px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-icon { font-size: 1.6em; margin-bottom: 4px; }
  .stat-label { font-size: 0.8em; color: #666; font-weight: 600; margin-bottom: 4px; }
  .stat-value { font-size: 1.15em; font-weight: 800; color: {{ACCENT}}; }
  .stat-sub { font-size: 0.75em; color: #777; margin-top: 2px; }

  /* 8. 평가 지표 & 코스/제품 스코어카드 (.infographic-scorecard-box) */
  .infographic-scorecard-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .scorecard-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 12px;
  }
  .scorecard-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 10px 14px;
  }
  .score-label {
    width: 110px;
    font-size: 0.86em;
    font-weight: 700;
    color: {{DARK}};
  }
  .score-bar-bg {
    flex: 1;
    height: 10px;
    background: #e5e7eb;
    border-radius: 5px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, {{TINT}}, {{ACCENT}});
    border-radius: 5px;
  }
  .score-value {
    width: 45px;
    text-align: right;
    font-size: 0.9em;
    font-weight: 800;
    color: {{ACCENT}};
  }
  .score-grade {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 0.72em;
    font-weight: 800;
    background: {{TINT}};
    color: {{ACCENT}};
  }

  /* 9. 장단점 & 추천 vs 비추천 대조 카드 (.infographic-procon-box) */
  .infographic-procon-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .procon-grid {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .pro-col {
    flex: 1;
    min-width: 220px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    padding: 14px;
  }
  .con-col {
    flex: 1;
    min-width: 220px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 14px;
  }
  .pro-badge {
    display: inline-block;
    background: #16a34a;
    color: #fff;
    font-size: 0.75em;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .con-badge {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 0.75em;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .procon-item {
    font-size: 0.82em;
    color: #374151;
    line-height: 1.5;
    padding: 5px 0;
    border-bottom: 1px dashed rgba(0,0,0,0.06);
  }
  .procon-item:last-child {
    border-bottom: none;
  }

  /* 10. 핵심 질문 & 해법 Q&A 매트릭스 (.infographic-faq-box) */
  .infographic-faq-box {
    background: {{SOFT}};
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .faq-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }
  .faq-card {
    background: #ffffff;
    border: 1px solid {{BORDER}};
    border-radius: 8px;
    padding: 12px 14px;
  }
  .faq-q {
    font-size: 0.88em;
    font-weight: 800;
    color: {{DARK}};
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .faq-q-badge {
    background: {{ACCENT}};
    color: #ffffff;
    font-size: 0.72em;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .faq-a {
    font-size: 0.82em;
    color: #555;
    line-height: 1.5;
  }

  /* 11. 진화형 범용 인포그래픽 프리미티브 (.infographic-custom-box) */
  .infographic-custom-box {
    background: #ffffff;
    border: 1.5px solid {{BORDER}};
    border-radius: 12px;
    padding: 22px 20px;
    margin: 35px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .info-callout {
    background: {{SOFT}};
    border-left: 4px solid {{ACCENT}};
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 0.84em;
    color: {{DARK}};
    line-height: 1.5;
    margin: 8px 0;
  }
  .info-pill-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0;
  }
  .info-pill {
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 0.78em;
    font-weight: 600;
    color: #374151;
  }
  .info-pill.active {
    background: {{TINT}};
    border-color: {{ACCENT}};
    color: {{ACCENT}};
    font-weight: 700;
  }
</style>
<script>
function copyPrompt(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(`button[onclick="copyPrompt('${id}')"]`);
    const orig = btn.innerText;
    btn.innerText = '복사 완료!'; btn.style.background = '#27ae60';
    setTimeout(() => { btn.innerText = orig; btn.style.background = '{{ACCENT}}'; }, 2000);
  });
}
</script>
</head>
<body>
