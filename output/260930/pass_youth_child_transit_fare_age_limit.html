<h1>청소년 어린이 대중교통 요금 나이 기준과 교통카드 생년월일 등록 안 하면 성인 요금 차액 손실 계산표</h1>

<div class="intro-box">
초등학교나 중학교에 입학하면서 자녀에게 처음 교통카드를 사주는 학부모님들이 가장 흔히 겪는 실수가 바로 '생년월일 미등록'입니다. 편의점에서 구입한 선불 교통카드는 최초 구입 시 임시 할인이 적용되더라도, 구입 후 10일(또는 카드사별 유예기간) 이내에 온라인이나 앱에 생년월일을 정식 등록하지 않으면 자동으로 <strong>일반 성인 요금으로 전환</strong>되어 차감됩니다.<br><br>
어린이(만 6세~12세)는 일반 요금의 약 60% 이상, 청소년(만 13세~18세)은 약 40% 이상 할인받을 수 있는 법적 권리가 있습니다. 오늘 포스팅에서는 2026년 최신 기준 어린이·청소년 대중교통 법정 나이 기준, 미등록 시 매달 버려지는 요금 차액 손실 계산표, 그리고 티머니·이즐(캐시비)·레일플러스 카드사별 간편 등록 절차 체크리스트를 상세히 안내해 드립니다.

<h2>04 | 편의점 현장 등록 vs 모바일 웹 온라인 등록 방법 차이</h2>

교통카드 생년월일 등록 방식은 크게 <strong>'편의점 현장 등록'</strong>과 <strong>'홈페이지·모바일 앱 등록'</strong> 두 가지로 나뉩니다.<br><br>

편의점(GS25, CU, 세븐일레븐, 이마트24)에서 카드를 구매할 때 아르바이트 직원에게 "어린이(또는 청소년) 카드로 등록해 주세요"라고 요청하고 자녀의 생년월일(8자리)을 단말기에 입력하면 <strong>그 즉시 현장에서 할인 적용이 시작</strong>됩니다.<br><br>

그러나 편의점 현장 등록은 일종의 '임시 등록' 성격을 지닙니다. 카드사 정책에 따라 구입일로부터 <strong>10일 이내에 카드사 공식 홈페이지나 앱에 본인 인증(부모 인증)을 거쳐 정식 회원 등록</strong>을 완료해야 영구적으로 할인이 유지됩니다. 10일 이내에 온라인 등록을 마치지 않으면 자동으로 성인 요금으로 환원되므로 반드시 홈페이지 등록까지 완료해야 합니다.

<h2>05 | 티머니·이즐(캐시비)·레일플러스 카드사별 등록 절차</h2>

국내에서 유통되는 대표 선불 교통카드 3사의 등록 절차와 사이트를 정리해 드립니다. 카드 뒷면에 적힌 카드 번호 16자리와 CVC 번호를 미리 메모해 두세요.<br><br>

<div class="step-box">
<strong>1. 티머니 (T-money)</strong><br>
- 공식 경로: 티머니 홈페이지(pay.tmoney.co.kr) 또는 '티머니 페이' 앱 접속<br>
- 메뉴: [카드등록] → [어린이/청소년 카드 등록]<br>
- 필요 정보: 카드 번호 16자리, CVC(3자리), 자녀 생년월일, 보호자 휴대폰 본인 인증<br>
- 비회원 등록도 가능하지만, 회원 가입 후 등록 시 분실·도난 시 잔액 환불 및 소득공제(30%) 혜택 가능.
</div>

<div class="step-box">
<strong>2. 이즐 (구 캐시비 / EZL)</strong><br>
- 공식 경로: 이즐 홈페이지(www.ezl.co.kr) 또는 '모바일이즐' 앱 접속<br>
- 메뉴: [카드 등록/변경] → [어린이·청소년 할인등록]<br>
- 절차: 카드 번호 16자리 입력 → 본인인증(만 14세 미만은 법정대리인 동의 필수) → 등록 완료.
</div>

<div class="step-box">
<strong>3. 레일플러스 (코레일)</strong><br>
- 공식 경로: 코레일 레일플러스 홈페이지(railplus.korail.com)<br>
- 메뉴: [청소년/어린이 할인등록]<br>
- 코레일 광역전철 역내 고객만족센터 또는 홈페이지에서 생년월일 등록 즉시 반영.
</div>

<h2>06 | 초등학교 입학·중학교 진학 시 카드 전환 기준일과 유효기간</h2>

어린이 카드를 사용하던 자녀가 중학교에 진학하거나, 청소년 카드를 쓰던 자녀가 고등학교를 졸업할 때 카드를 새로 사야 할까요? <strong>새 카드를 살 필요가 전혀 없습니다.</strong><br><br>

교통카드 전산망에는 등록된 '생년월일'이 기록되어 있어, 자녀의 나이가 <strong>만 13세가 되는 생일 당일 자정(00:00)</strong>에 어린이 요금에서 청소년 요금으로 시스템이 자동 전환됩니다.<br><br>

마찬가지로 고등학교를 졸업하고 <strong>만 19세가 되는 생일 당일 자정</strong>에는 청소년 요금에서 일반 성인 요금으로 자동 변경됩니다. 따라서 카드가 물리적으로 파손되거나 분실되지 않는 한, 한 장의 카드로 성인이 될 때까지 계속 충전하며 사용할 수 있습니다.

<h2>07 | 청소년 후불교통카드 발급 대상과 법정대리인 필요서류</h2>

매번 편의점이나 지하철역에서 현금으로 충전하는 번거로움을 덜고 싶다면 은행이나 카드사에서 발급하는 <strong>'청소년 후불교통 체크카드'</strong>를 신청하는 것이 가장 편리합니다.<br><br>

만 12세 이상부터 만 18세 이하 청소년은 법정대리인의 동의 하에 후불교통 기능이 탑재된 체크카드를 발급받을 수 있습니다. 이용 한도는 월 5만 원(카드사별 최대 10만 원)으로 설정되어 무분별한 과소비를 예방합니다.<br><br>

<div class="info-box">
<strong>📄 은행 방문 시 법정대리인 지참 필수 서류</strong><br>
1. <strong>법정대리인 신분증</strong> (주민등록증 또는 운전면허증)<br>
2. <strong>가족관계증명서</strong> (자녀 기준 상세증명서, 3개월 이내 발급, 주민번호 뒷자리 공개)<br>
3. <strong>기본증명서</strong> (자녀 기준 특정 또는 상세증명서, 3개월 이내 발급)<br>
4. <strong>자녀 도장</strong> (부모 서명으로 대체 가능한 은행도 있음)
</div>

후불카드는 발급 시점에 주민등록번호가 금융사에 정식 등록되므로, 별도의 인터넷 생년월일 등록 절차 없이 수령 즉시 청소년 할인이 자동으로 적용됩니다.

<h2>08 | 타 지역 광역버스 및 시외버스 탑승 시 청소년 할인 적용 기준</h2>

서울·경기 카드로 지방에 여행을 가거나 고속버스·시외버스를 탈 때도 청소년 할인이 그대로 적용될까요?<br><br>

전국 호환 교통카드(One Card All Pass 마크가 찍힌 카드)는 부산, 대구, 대전, 광주 등 전국 모든 시내버스와 도시철도에서 동일하게 등록된 생년월일 기준 청소년·어린이 요금으로 자동 차감됩니다.<br><br>

단, <strong>시외버스와 고속버스</strong>는 시내 대중교통과 전산망이 다릅니다. 고속버스는 교통카드 태그 방식이 아니라 승차권 예매 방식이므로, 티머니GO나 버스타고 앱에서 예매 시 '중고생' 권종을 선택해야 20% 할인을 받을 수 있으며, 탑승 시 학생증이나 청소년증 제시를 요구받을 수 있습니다.

<h2>09 | 자녀 교통카드 등록 및 요금 누락 방지 최종 체크리스트</h2>

소중한 자녀의 통학 교통비가 불필요하게 낭비되지 않도록 지금 즉시 확인해야 할 체크리스트입니다.<br><br>

<div class="warn-box">
<strong>✅ 자녀 교통카드 관리 5대 체크포인트</strong><br>
- [ ] <strong>편의점 등록 후 10일 이내 홈페이지 정식 등록 여부</strong>: 미등록 시 성인 요금 전환 위험 차단.<br>
- [ ] <strong>카드사 회원 가입 및 소득공제 신청</strong>: 연말정산 시 대중교통 이용액 30~40% 소득공제 반영.<br>
- [ ] <strong>지하철 개찰구 태그 시 음성 확인</strong>: 성인은 "삑" 1회, 청소년은 "삑삑" 2회, 어린이는 "삑삑삑" 3회 울립니다. 자녀가 탈 때 비프음 횟수를 꼭 확인해 보세요.<br>
- [ ] <strong>티머니 페이 앱으로 잔액 및 최근 거래내역 조회</strong>: 차감된 요금이 800원(청소년)인지 1,400원(성인)인지 주기적으로 확인.<br>
- [ ] <strong>만 12세 이상 청소년 후불교통 체크카드 교체 검토</strong>: 충전 번거로움 해소 및 전산 자동 연계.
</div>

작은 관심과 5분의 등록 투자로 1년에 20~40만 원의 아까운 교통비를 절약하고, 자녀에게 현명한 대중교통 이용 습관을 길러주시기 바랍니다.
