<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== P2 : 코스 단계 · 위택스 신청 4단계 (행정정보 팔레트 · gov_car_tax_annual_discount) ===== -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#0d1a0e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#388e3c"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">위택스 신청 방법</text>
  <rect x="82" y="304" width="140" height="9" fill="#388e3c"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="442" font-size="42" font-weight="700" fill="#ffffff">wetax.go.kr 접속 · 로그인</text>
    <text x="80" y="488" font-size="28" font-weight="500" fill="#a5d6a7">공동인증서 / 간편인증(카카오·네이버·PASS)</text>
    <text x="1000" y="458" font-size="36" font-weight="800" fill="#c5e1a5" text-anchor="end">Step 1</text>
    <line x1="80" y1="540" x2="1000" y2="540" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="612" font-size="42" font-weight="700" fill="#ffffff">자동차세 연납 신청 메뉴</text>
    <text x="80" y="658" font-size="28" font-weight="500" fill="#a5d6a7">로그인 후 '자동차세 연납 신청' 검색</text>
    <text x="1000" y="628" font-size="36" font-weight="800" fill="#c5e1a5" text-anchor="end">Step 2</text>
    <line x1="80" y1="710" x2="1000" y2="710" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="782" font-size="42" font-weight="700" fill="#ffffff">차량 자동 조회 · 절감액 확인</text>
    <text x="80" y="828" font-size="28" font-weight="500" fill="#a5d6a7">본인 명의 차량 자동 표시 · 신청 전 절감 금액 확인</text>
    <text x="1000" y="798" font-size="36" font-weight="800" fill="#c5e1a5" text-anchor="end">Step 3</text>
    <line x1="80" y1="880" x2="1000" y2="880" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="952" font-size="42" font-weight="700" fill="#ffffff">계좌이체 · 카드 납부</text>
    <text x="80" y="998" font-size="28" font-weight="500" fill="#a5d6a7">카드 납부 시 포인트·캐시백 추가 적립 가능</text>
    <text x="1000" y="968" font-size="36" font-weight="800" fill="#c5e1a5" text-anchor="end">Step 4</text>
    <line x1="80" y1="1050" x2="1000" y2="1050" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="1122" font-size="42" font-weight="700" fill="#ffffff">영수증 저장</text>
    <text x="1000" y="1122" font-size="36" font-weight="800" fill="#c5e1a5" text-anchor="end">완료</text>
  </g>

  <text x="80" y="1240" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#a5d6a7">운영시간: 평일 07:00~22:00 · 토 07:00~15:00</text>

  <!-- ===== 브랜드 워터마크 ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#1b5e20"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
