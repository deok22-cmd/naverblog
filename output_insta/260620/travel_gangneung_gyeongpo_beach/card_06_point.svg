<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== A : 헤드라인-하단 — point 4: 연계 코스 오죽헌·경포대·정동진 (꼭지 ⑧) =====
       레이아웃 A_headline_bottom 차용. point 4번째 → POOL[(0+6)%6]=A (인접 A-A 충돌 회피:
       card_03=A, card_04=C, card_05=E, card_06=A → card_05(E)와 인접 → 충돌 없음). -->
  <defs>
    <linearGradient id="scrimBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.40" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimBottom)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <!-- 강조 틱 -->
  <rect x="80" y="852" width="64" height="10" fill="#00796b"/>

  <!-- 헤드라인 -->
  <text x="80" y="960" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">강릉 3대 연계</text>
  <text x="80" y="1060" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">당일 코스</text>

  <!-- 칩 -->
  <g id="chips">
    <rect x="80" y="1098" width="280" height="68" rx="34" fill="#00796b"/>
    <text x="220" y="1141" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="31" font-weight="700" fill="#ffffff">오죽헌 3,000원</text>
    <rect x="376" y="1098" width="254" height="68" rx="34" fill="#00796b"/>
    <text x="503" y="1141" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="31" font-weight="700" fill="#ffffff">정동진 30분</text>
  </g>

  <!-- 서브라인 -->
  <text x="80" y="1240" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="500" fill="#e0f2f1">오죽헌(차 10분) · 경포대(호수 전망)</text>
  <text x="80" y="1292" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="500" fill="#e0f2f1">정동진(남쪽 차 30분) 세트 공략.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
