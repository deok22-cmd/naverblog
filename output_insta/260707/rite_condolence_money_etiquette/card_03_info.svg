<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_03_info · P1 · 관계별 조의금 통상 금액대 (5행) -->
  <!-- P1 : 정보 표 (사진중심 · 전면 스크림 워시만) — 팔레트: rite_ warm brown -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#1c1510"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#8d6e63"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">관계별 조의금</text>
  <rect x="82" y="304" width="140" height="9" fill="#8d6e63"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="450" font-size="40" font-weight="600" fill="#ffffff">직장 동료 · 가벼운 사이</text>
    <text x="1000" y="450" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">3만 원 내외</text>
    <line x1="80" y1="492" x2="1000" y2="492" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="582" font-size="40" font-weight="600" fill="#ffffff">직장 동료 · 친한 경우 / 친구</text>
    <text x="1000" y="582" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">5만 원 내외</text>
    <line x1="80" y1="624" x2="1000" y2="624" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="714" font-size="40" font-weight="600" fill="#ffffff">친한 친구 · 가까운 지인</text>
    <text x="1000" y="714" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">5~10만 원</text>
    <line x1="80" y1="756" x2="1000" y2="756" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="846" font-size="40" font-weight="600" fill="#ffffff">상사 · 선배 / 부모상</text>
    <text x="1000" y="846" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">5~10만 원</text>
    <line x1="80" y1="888" x2="1000" y2="888" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="978" font-size="40" font-weight="600" fill="#ffffff">가까운 친인척</text>
    <text x="1000" y="978" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">10만 원 이상</text>
  </g>

  <text x="80" y="1110" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#d7ccc8">지역·집안에 따라 다를 수 있음 · 관례 참고 기준</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#4e342e"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
