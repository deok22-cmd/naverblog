<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== P1 : 정보 표 — card_04 info (담배 면세 기준 6행) =====
       소스: h2 03 담배 면세 한도 info-table 6행 → P1
       P1은 5행이 기준이나 6행을 Y간격 조정하여 수용
       국내여행 팔레트: #00796b / #004d40 / #e0f2f1 / #80cbc4 / #b2dfdb -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <text x="80" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">담배 면세 기준</text>
  <rect x="82" y="254" width="140" height="9" fill="#00796b"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <!-- 행 1 -->
    <text x="80" y="360" font-size="38" font-weight="600" fill="#ffffff">일반 궐련</text>
    <text x="1000" y="360" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">200개비 (1보루)</text>
    <line x1="80" y1="395" x2="1000" y2="395" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- 행 2 -->
    <text x="80" y="454" font-size="38" font-weight="600" fill="#ffffff">엽권련 (시가)</text>
    <text x="1000" y="454" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">50개비</text>
    <line x1="80" y1="490" x2="1000" y2="490" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- 행 3 -->
    <text x="80" y="549" font-size="38" font-weight="600" fill="#ffffff">전자담배 (궐련형)</text>
    <text x="1000" y="549" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">200개비</text>
    <line x1="80" y1="585" x2="1000" y2="585" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- 행 4 -->
    <text x="80" y="644" font-size="38" font-weight="600" fill="#ffffff">전자담배 (니코틴 용액)</text>
    <text x="1000" y="644" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">20ml</text>
    <line x1="80" y1="680" x2="1000" y2="680" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- 행 5 -->
    <text x="80" y="739" font-size="38" font-weight="600" fill="#ffffff">전자담배 (기타 유형)</text>
    <text x="1000" y="739" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">110g</text>
    <line x1="80" y1="775" x2="1000" y2="775" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- 행 6 -->
    <text x="80" y="834" font-size="38" font-weight="600" fill="#ffffff">기타 담배</text>
    <text x="1000" y="834" font-size="38" font-weight="800" fill="#80cbc4" text-anchor="end">250g</text>
  </g>

  <text x="80" y="960" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">두 종류 이상 동시 반입 시 한 종류에만 면세 적용.</text>
  <text x="80" y="1010" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">만 19세 미만은 면세 혜택 없음.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
