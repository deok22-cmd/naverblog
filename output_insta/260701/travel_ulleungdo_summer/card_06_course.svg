<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== P2 : 코스 단계 — course (2박3일 울릉도 여름 코스) =====
       카테고리: 국내여행 / 레이아웃: P2_timeline_text
       step-box 원고: 1일차/2일차/3일차 3단계 → P2 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <!-- 타이틀 -->
  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">2박 3일 추천 코스</text>
  <rect x="82" y="304" width="140" height="9" fill="#00796b"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <!-- 1일차 -->
    <text x="80" y="442" font-size="42" font-weight="700" fill="#ffffff">1일차 — 도착 · 행남해안산책로</text>
    <text x="80" y="492" font-size="28" font-weight="500" fill="#b2dfdb">포항/동해 출항 → 도동항 → 행남산책로 → 저동 저녁</text>
    <text x="1000" y="458" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">이동일</text>
    <line x1="80" y1="544" x2="1000" y2="544" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 2일차 -->
    <text x="80" y="616" font-size="42" font-weight="700" fill="#ffffff">2일차 — 독도 투어 · 봉래폭포</text>
    <text x="80" y="666" font-size="28" font-weight="500" fill="#b2dfdb">오전 독도 투어(기상 확인 필수) → 오후 봉래폭포·나리분지</text>
    <text x="1000" y="632" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">핵심일</text>
    <line x1="80" y1="714" x2="1000" y2="714" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 3일차 -->
    <text x="80" y="786" font-size="42" font-weight="700" fill="#ffffff">3일차 — 케이블카 · 귀항</text>
    <text x="80" y="836" font-size="28" font-weight="500" fill="#b2dfdb">오전 도동 케이블카 · 성인봉(선택) → 귀항 배편 탑승</text>
    <text x="1000" y="802" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">귀가일</text>
    <line x1="80" y1="884" x2="1000" y2="884" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 총 소요 -->
    <text x="80" y="956" font-size="42" font-weight="700" fill="#ffffff">총 권장 일정</text>
    <text x="1000" y="956" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">2박 3일</text>
  </g>

  <text x="80" y="1200" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">독도 포함 시 날씨 변수 고려 — 최소 2박 권장.</text>
  <text x="80" y="1244" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">전체 코스는 프로필 블로그에서 확인하세요.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
