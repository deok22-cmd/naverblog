<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== P4 : 핵심 팩트 — info (배편 출항지 3개) =====
       카테고리: 국내여행 / 레이아웃: P4_key_facts
       원고 info-table 3행 → P4 핵심지표 3개 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.64"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <!-- 타이틀 -->
  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">배편 출항지별 정보</text>
  <rect x="82" y="304" width="140" height="9" fill="#00796b"/>

  <!-- 팩트 3개 (라벨 → 값) -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <!-- 팩트 1: 포항 -->
    <text x="80" y="450" font-size="30" font-weight="600" fill="#b2dfdb">포항 여객터미널</text>
    <text x="80" y="512" font-size="56" font-weight="800" fill="#ffffff">약 3시간</text>
    <text x="80" y="558" font-size="28" font-weight="500" fill="#80cbc4">대형 쾌속선 · 수도권 접근성 중간</text>
    <line x1="80" y1="596" x2="1000" y2="596" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 팩트 2: 동해항 -->
    <text x="80" y="660" font-size="30" font-weight="600" fill="#b2dfdb">동해항</text>
    <text x="80" y="722" font-size="56" font-weight="800" fill="#ffffff">약 2시간 30분</text>
    <text x="80" y="768" font-size="28" font-weight="500" fill="#80cbc4">강원도 접근 시 효율적</text>
    <line x1="80" y1="806" x2="1000" y2="806" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 팩트 3: 강릉 안인항 -->
    <text x="80" y="870" font-size="30" font-weight="600" fill="#b2dfdb">강릉 안인항</text>
    <text x="80" y="932" font-size="56" font-weight="800" fill="#ffffff">약 2시간 40분</text>
    <text x="80" y="978" font-size="28" font-weight="500" fill="#80cbc4">KTX 강릉역 연계 가능</text>
  </g>

  <!-- 보조 안내 -->
  <text x="80" y="1180" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">성수기 7~8월 주말 배편은 2~3주 전 매진 주의.</text>
  <text x="80" y="1228" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">한국해운조합 island.theksa.co.kr 에서 예약.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
