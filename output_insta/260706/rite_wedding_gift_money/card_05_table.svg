<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_05_table · P1 · 관계별 축의금 금액 한눈에 (6행) -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#1c1510"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#8d6e63"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">관계별 금액 한눈에</text>
  <rect x="82" y="304" width="140" height="9" fill="#8d6e63"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="420" font-size="40" font-weight="600" fill="#ffffff">가벼운 지인·동료</text>
    <text x="1000" y="420" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">5만 원</text>
    <line x1="80" y1="460" x2="1000" y2="460" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="540" font-size="40" font-weight="600" fill="#ffffff">직장 동료(같은 팀)</text>
    <text x="1000" y="540" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">5~10만 원</text>
    <line x1="80" y1="580" x2="1000" y2="580" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="660" font-size="40" font-weight="600" fill="#ffffff">친한 동료·상사</text>
    <text x="1000" y="660" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">10~15만 원</text>
    <line x1="80" y1="700" x2="1000" y2="700" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="780" font-size="40" font-weight="600" fill="#ffffff">친한 친구</text>
    <text x="1000" y="780" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">10~20만 원</text>
    <line x1="80" y1="820" x2="1000" y2="820" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="900" font-size="40" font-weight="600" fill="#ffffff">가족·친척(사촌 이내)</text>
    <text x="1000" y="900" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">30만 원 이상</text>
    <line x1="80" y1="940" x2="1000" y2="940" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <text x="80" y="1020" font-size="40" font-weight="600" fill="#ffffff">불참 시(계좌이체)</text>
    <text x="1000" y="1020" font-size="40" font-weight="800" fill="#bcaaa4" text-anchor="end">3~5만 원</text>
  </g>

  <text x="80" y="1130" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#d7ccc8">통상 참고 범위 · 지역·세대별 편차 있음</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#4e342e"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
