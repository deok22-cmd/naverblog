<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== P1 : 정보 표 — info : 운영 정보 6행 (전면 스크림 워시 위 텍스트) =====
       P1 기본 5행 구조를 6행으로 확장. font-size 36, 행간 110px -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- BG START -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- BG END -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <text x="80" y="240" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">운영 정보 한눈에</text>
  <rect x="82" y="274" width="140" height="9" fill="#00796b"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <!-- 행 1 -->
    <text x="80" y="420" font-size="36" font-weight="600" fill="#ffffff">코스 거리</text>
    <text x="1000" y="420" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">약 7.2km (편도)</text>
    <line x1="80" y1="452" x2="1000" y2="452" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- 행 2 -->
    <text x="80" y="530" font-size="36" font-weight="600" fill="#ffffff">소요 시간</text>
    <text x="1000" y="530" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">약 60~80분</text>
    <line x1="80" y1="562" x2="1000" y2="562" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- 행 3 -->
    <text x="80" y="640" font-size="36" font-weight="600" fill="#ffffff">운영 시간</text>
    <text x="1000" y="640" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">09:00~17:00 (성수기)</text>
    <line x1="80" y1="672" x2="1000" y2="672" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- 행 4 -->
    <text x="80" y="750" font-size="36" font-weight="600" fill="#ffffff">요금</text>
    <text x="1000" y="750" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">성인 2만 원대 (공홈 확인)</text>
    <line x1="80" y1="782" x2="1000" y2="782" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- 행 5 -->
    <text x="80" y="860" font-size="36" font-weight="600" fill="#ffffff">셔틀 복귀</text>
    <text x="1000" y="860" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">구절리→아우라지 별도</text>
    <line x1="80" y1="892" x2="1000" y2="892" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- 행 6 -->
    <text x="80" y="970" font-size="36" font-weight="600" fill="#ffffff">예약 방법</text>
    <text x="1000" y="970" font-size="36" font-weight="800" fill="#80cbc4" text-anchor="end">공식 홈 온라인 예약</text>
  </g>

  <text x="80" y="1090" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="500" fill="#b2dfdb">2026년 성수기 기준 · 방문 전 공식 홈페이지에서 최신 요금 확인</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
