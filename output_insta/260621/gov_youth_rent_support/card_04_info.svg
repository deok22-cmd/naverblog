<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_04_info · P4 핵심 팩트 · 소득기준 핵심 지표 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.64"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#0d1a10"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#388e3c"/>

  <text x="80" y="200" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="800" fill="#ffffff">소득 기준 한눈에</text>
  <rect x="82" y="232" width="140" height="9" fill="#388e3c"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="340" font-size="28" font-weight="600" fill="#a5d6a7">청년가구 소득</text>
    <text x="80" y="394" font-size="44" font-weight="800" fill="#ffffff">중위소득 60% 이하</text>
    <text x="80" y="440" font-size="32" font-weight="500" fill="#c8e6c9">1인 가구 약 134만원/월 이하</text>
    <line x1="80" y1="472" x2="1000" y2="472" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="540" font-size="28" font-weight="600" fill="#a5d6a7">원가구 소득</text>
    <text x="80" y="594" font-size="44" font-weight="800" fill="#ffffff">중위소득 100% 이하</text>
    <text x="80" y="640" font-size="32" font-weight="500" fill="#c8e6c9">4인 가구 약 572만원/월 이하</text>
    <line x1="80" y1="672" x2="1000" y2="672" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="740" font-size="28" font-weight="600" fill="#a5d6a7">청년가구 순자산</text>
    <text x="80" y="794" font-size="44" font-weight="800" fill="#ffffff">1억 2,200만원 이하</text>
    <text x="80" y="840" font-size="32" font-weight="500" fill="#c8e6c9">자동차·금융 포함</text>
    <line x1="80" y1="872" x2="1000" y2="872" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="940" font-size="28" font-weight="600" fill="#a5d6a7">임차 주택</text>
    <text x="80" y="994" font-size="44" font-weight="800" fill="#ffffff">전용 60㎡ · 보증금 5,000만원 이하</text>
    <text x="80" y="1040" font-size="32" font-weight="500" fill="#c8e6c9">전세(보증금만 있는 경우)는 제외</text>
  </g>

  <text x="80" y="1160" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#a5d6a7">2026년 복지로 공식 발표 기준 · 차년도 변동 가능.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#1b5e20"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
