<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_05_course · P2 · 차량 침수 시 탈출 4단계 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#0d1a0e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#388e3c"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">침수 탈출 4단계</text>
  <rect x="82" y="304" width="140" height="9" fill="#388e3c"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="442" font-size="42" font-weight="700" fill="#ffffff">즉시 창문 열기</text>
    <text x="80" y="488" font-size="28" font-weight="500" fill="#a5d6a7">전기 계통 살아있을 때만 전동창 작동</text>
    <text x="1000" y="458" font-size="36" font-weight="800" fill="#81c784" text-anchor="end">STEP 1</text>
    <line x1="80" y1="540" x2="1000" y2="540" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="612" font-size="42" font-weight="700" fill="#ffffff">안전벨트 해제</text>
    <text x="80" y="658" font-size="28" font-weight="500" fill="#a5d6a7">레스큐 도구(커터·유리 파쇄 해머) 비치 권장</text>
    <text x="1000" y="628" font-size="36" font-weight="800" fill="#81c784" text-anchor="end">STEP 2</text>
    <line x1="80" y1="710" x2="1000" y2="710" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="782" font-size="42" font-weight="700" fill="#ffffff">탈출 우선, 소지품은 나중에</text>
    <text x="80" y="828" font-size="28" font-weight="500" fill="#a5d6a7">문 안 열리면 창문으로, 창문도 안 열리면 헤드레스트봉으로 유리 모서리 타격</text>
    <text x="1000" y="798" font-size="36" font-weight="800" fill="#81c784" text-anchor="end">STEP 3</text>
    <line x1="80" y1="880" x2="1000" y2="880" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="952" font-size="42" font-weight="700" fill="#ffffff">높은 곳 이동 후 119 신고</text>
    <text x="80" y="998" font-size="28" font-weight="500" fill="#a5d6a7">침수 구간 물 흐름 빠름 — 탈출 후도 주의</text>
    <text x="1000" y="968" font-size="36" font-weight="800" fill="#81c784" text-anchor="end">STEP 4</text>
  </g>

  <text x="80" y="1240" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#a5d6a7">탈출 후 절대 재시동 금지 — 엔진 파손 확정.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#1b5e20"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
