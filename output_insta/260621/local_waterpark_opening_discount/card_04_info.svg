<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- ===== card_04 : info — 캐베 vs 오션월드 비교 (레이아웃 P1: 정보 표) ===== -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#0d1f1e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#388e3c"/>

  <text x="80" y="200" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">캐베 vs 오션월드</text>
  <rect x="82" y="234" width="140" height="9" fill="#388e3c"/>

  <!-- 컬럼 헤더 -->
  <text x="80" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#a5d6a7" letter-spacing="2">구분</text>
  <text x="480" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#a5d6a7">캐리비안베이</text>
  <text x="800" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#a5d6a7">오션월드</text>
  <line x1="80" y1="360" x2="1000" y2="360" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <!-- 행1: 위치 -->
    <text x="80" y="440" font-size="38" font-weight="600" fill="#ffffff">위치</text>
    <text x="480" y="440" font-size="34" font-weight="500" fill="#c8e6c9">경기 용인 (1.5h)</text>
    <text x="800" y="440" font-size="34" font-weight="500" fill="#c8e6c9">강원 홍천 (2h)</text>
    <line x1="80" y1="468" x2="1000" y2="468" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 행2: 규모 -->
    <text x="80" y="558" font-size="38" font-weight="600" fill="#ffffff">규모</text>
    <text x="480" y="558" font-size="34" font-weight="500" fill="#a5d6a7">국내 최대</text>
    <text x="800" y="558" font-size="34" font-weight="500" fill="#c8e6c9">국내 2~3위</text>
    <line x1="80" y1="586" x2="1000" y2="586" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 행3: 주변 -->
    <text x="80" y="676" font-size="38" font-weight="600" fill="#ffffff">주변</text>
    <text x="480" y="676" font-size="34" font-weight="500" fill="#c8e6c9">에버랜드 연계</text>
    <text x="800" y="676" font-size="34" font-weight="500" fill="#c8e6c9">산속 리조트</text>
    <line x1="80" y1="704" x2="1000" y2="704" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 행4: 혼잡 -->
    <text x="80" y="794" font-size="38" font-weight="600" fill="#ffffff">주말 혼잡</text>
    <text x="480" y="794" font-size="34" font-weight="500" fill="#ef9a9a">매우 높음</text>
    <text x="800" y="794" font-size="34" font-weight="500" fill="#c8e6c9">높음 (여유)</text>
    <line x1="80" y1="822" x2="1000" y2="822" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 행5: 숙박 -->
    <text x="80" y="912" font-size="38" font-weight="600" fill="#ffffff">숙박 연계</text>
    <text x="480" y="912" font-size="34" font-weight="500" fill="#c8e6c9">에버랜드 호텔</text>
    <text x="800" y="912" font-size="34" font-weight="500" fill="#a5d6a7">비발디파크 리조트</text>
  </g>

  <text x="80" y="1060" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#a5d6a7">당일치기=캐베, 1박 자연힐링=오션월드.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#1b5e20"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
