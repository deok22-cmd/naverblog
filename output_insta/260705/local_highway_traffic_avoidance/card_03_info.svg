<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_03 : P4 핵심팩트 — info (방향별 권장 출발 시간)
       카테고리: 국내여행(local_) | 팔레트: #00796b / #004d40 / #e0f2f1 / #b2dfdb
       원고 h2 02 info-table 3행 기반 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.64"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="62" font-weight="800" fill="#ffffff">권장 출발 시간</text>
  <rect x="82" y="304" width="140" height="9" fill="#00796b"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="430" font-size="30" font-weight="600" fill="#b2dfdb">수도권 → 남해·동해 (출발)</text>
    <text x="80" y="490" font-size="46" font-weight="800" fill="#ffffff">금 오전 6시 이전 · 자정 이후</text>
    <line x1="80" y1="540" x2="1000" y2="540" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="630" font-size="30" font-weight="600" fill="#b2dfdb">남해·동해 → 수도권 (귀경)</text>
    <text x="80" y="690" font-size="46" font-weight="800" fill="#ffffff">일 오전 7시 이전 · 오후 9시 이후</text>
    <line x1="80" y1="740" x2="1000" y2="740" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="830" font-size="30" font-weight="600" fill="#b2dfdb">수도권 → 서해 (출발)</text>
    <text x="80" y="890" font-size="46" font-weight="800" fill="#ffffff">금·토 오전 6시 이전</text>
    <line x1="80" y1="940" x2="1000" y2="940" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <text x="80" y="1030" font-size="30" font-weight="600" fill="#b2dfdb">피해야 할 최악 시간대</text>
    <text x="80" y="1090" font-size="46" font-weight="800" fill="#ffffff">금 오후 2~10시 / 일 오후 2~9시</text>
  </g>

  <text x="80" y="1240" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">2026년 여름 성수기 기준 · 새벽 5시 이전 출발이 가장 효과적.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
