<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_08 : P3 체크리스트 — tips (출발 전 체크리스트 · 저장 유도)
       카테고리: 국내여행(local_) | 팔레트: #00796b / #004d40 / #80cbc4 / #b2dfdb
       원고 h2 10 step-box: 출발 전 점검 리스트 6항목 중 4개 -->
  <defs>
    <linearGradient id="scrimFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimFull)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <text x="80" y="270" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="800" fill="#ffffff">출발 전 체크리스트</text>
  <rect x="82" y="304" width="140" height="9" fill="#00796b"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <rect x="80" y="430" width="34" height="8" fill="#80cbc4"/>
    <text x="80" y="500" font-size="40" font-weight="600" fill="#ffffff">전날 밤 교통·기상 예보 확인</text>
    <line x1="80" y1="556" x2="1000" y2="556" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <rect x="80" y="606" width="34" height="8" fill="#80cbc4"/>
    <text x="80" y="676" font-size="40" font-weight="600" fill="#ffffff">출발 2시간 전 실시간 앱 재확인</text>
    <line x1="80" y1="732" x2="1000" y2="732" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <rect x="80" y="782" width="34" height="8" fill="#80cbc4"/>
    <text x="80" y="852" font-size="40" font-weight="600" fill="#ffffff">냉각수·타이어·에어컨 필터 점검</text>
    <line x1="80" y1="908" x2="1000" y2="908" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <rect x="80" y="958" width="34" height="8" fill="#80cbc4"/>
    <text x="80" y="1028" font-size="40" font-weight="600" fill="#ffffff">연료 만탱크 / 전기차 70% 이상 충전</text>
  </g>

  <text x="80" y="1142" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#80cbc4">저장해두고 그대로 따라가세요  ↓</text>
  <text x="80" y="1232" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="500" fill="#b2dfdb">전체 가이드는 프로필 블로그에서.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
