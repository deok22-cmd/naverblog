<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- card_07 : A 헤드라인하단 — caution (침수 도로 절대 통과 금지)
       카테고리: 국내여행(local_) | 팔레트: #00796b / #004d40 / #e0f2f1
       원고 caution-box: 10cm 수심에서도 제어력 상실 위험
       [caution=A, non-adjacent to card_04=A → OK] -->
  <defs>
    <linearGradient id="scrimBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.40" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- ▼▼▼ Figma/Phase B: 이 사각형 1개만 배경 이미지로 치환 ▼▼▼ -->
  <rect id="BG__REPLACE_WITH_IMAGE" x="0" y="0" width="1080" height="1350" fill="#16201e"/>
  <!-- ▲▲▲ 배경 슬롯 ▲▲▲ -->

  <rect x="0" y="0" width="1080" height="1350" fill="url(#scrimBottom)"/>
  <rect id="brand-bar" x="0" y="0" width="14" height="1350" fill="#00796b"/>

  <rect x="80" y="852" width="64" height="10" fill="#00796b"/>
  <text x="80" y="968" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="94" font-weight="800" fill="#ffffff" letter-spacing="-2">침수 통과 금지</text>

  <g id="chips">
    <rect x="80" y="1022" width="340" height="70" rx="35" fill="#00796b"/>
    <text x="250" y="1067" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">10cm 수심도 위험</text>
    <rect x="440" y="1022" width="340" height="70" rx="35" fill="#00796b"/>
    <text x="610" y="1067" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">공식 우회로 이용</text>
  </g>

  <text x="80" y="1184" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="37" font-weight="500" fill="#e0f2f1">물이 고인 도로는 절대 무리하게 통과하지 마세요.</text>
  <text x="80" y="1238" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="37" font-weight="500" fill="#e0f2f1">태풍·집중호우 시 공식 통제 우회로를 따르세요.</text>

  <!-- ===== 브랜드 워터마크 (우측 하단 고정 · 문서상 마지막 = 항상 최상단) ===== -->
  <g id="brand-watermark">
    <path d="M822 1251 H1080 V1350 H792 V1281 A30 30 0 0 1 822 1251 Z" fill="#004d40"/>
    <text x="936" y="1310" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="0.5">travelkorea_365</text>
  </g>
</svg>
